name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 协议层与刷写流程测试都不碰总线，只装文件解析依赖。
      # 界面测试在 CI 里跳过（没有 PySide6 与 GL 库），本地用离屏后端跑。
      - name: install test dependencies
        run: pip install bincopy

      - name: unit tests
        run: make check
